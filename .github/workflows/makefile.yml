name: Build Kernel

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex git \
            libssl-dev libncurses-dev lzop unzip zip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Replace gcc-wrapper (fix python2 issue)
        run: |
          printf '%s\n' \
          '#!/usr/bin/env python3' \
          'import os' \
          'import sys' \
          'os.execvp(sys.argv[1], sys.argv[1:])' \
          > scripts/gcc-wrapper.py
          chmod +x scripts/gcc-wrapper.py

      - name: Setup Clang r383902
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          echo "$PWD/clang/clang-r383902/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          mkdir -p out
          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/vangogh_user_defconfig

          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - uses: actions/upload-artifact@v4
        with:
          name: Image
          path: out/arch/arm64/boot/Image*
