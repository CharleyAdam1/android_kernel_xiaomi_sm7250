name: Build Kernel

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex git \
            libssl-dev libncurses5-dev libncurses-dev \
            lzop repo unzip zip \
            python-is-python3

      - name: Fix python2 gcc-wrapper (msm-4.19 compatibility)
        run: |
          if [ -f kernel/msm-4.19/scripts/gcc-wrapper.py ]; then
            sed -i 's/print "error, forbidden warning:", m.group(2)/print("error, forbidden warning:", m.group(2))/g' kernel/msm-4.19/scripts/gcc-wrapper.py
          fi

      - name: Setup Clang (Android r383902)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          export PATH=$PWD/clang/clang-r383902/bin:$PATH
          echo "PATH=$PWD/clang/clang-r383902/bin:$PATH" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          cd kernel/msm-4.19
          mkdir -p out
          make O=out ARCH=arm64 vendor/vangogh_user_defconfig
          make -j1 O=out ARCH=arm64

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: kernel/msm-4.19/out/arch/arm64/boot/Image*
