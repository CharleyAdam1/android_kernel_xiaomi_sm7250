name: Build Kernel

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-20.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git libssl-dev libncurses5-dev lzop repo unzip zip python-is-python3
          sudo apt install -y python2-minimal || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python || true

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/CharleyAdam1/android_kernel_xiaomi_sm7250 -b lineage-19.1 kernel
          
      - name: Setup Clang
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          export PATH=$PWD/clang/clang-r383902/bin:$PATH
          echo "PATH=$PWD/clang/clang-r383902/bin:$PATH" >> $GITHUB_ENV

      - name: Build Kernel (Single Thread Debug Mode)
        run: |
          cd kernel
          mkdir out
          make O=out ARCH=arm64 vendor/vangogh_user_defconfig
          make -j1 O=out ARCH=arm64 V=1
